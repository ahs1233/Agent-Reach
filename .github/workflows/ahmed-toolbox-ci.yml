name: Ahmed ToolBox CI

on:
  push:
    branches:
      - feat/ahmed-toolbox-mcp
  pull_request:
    paths:
      - "agent_reach/toolbox/**"
      - "integrations/panwatch/**"
      - "tests/test_toolbox_gateway.py"
      - "tests/test_xau_intraday_integration.py"
      - "pyproject.toml"
      - ".github/workflows/ahmed-toolbox-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Syntax
        run: python -m compileall -q agent_reach integrations/panwatch

      - name: Ruff
        run: |
          ruff check agent_reach/toolbox
          ruff check tests/test_toolbox_gateway.py tests/test_xau_intraday_integration.py

      - name: Focused tests
        run: |
          pytest -q tests/test_toolbox_gateway.py tests/test_xau_intraday_integration.py
