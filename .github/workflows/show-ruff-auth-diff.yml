name: Show Ruff Auth Diff
on:
  push:
    branches:
      - stabilization/ruff-auth-preflight-diff
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.1
      - name: Show formatter diff
        run: |
          ruff format scripts/production_acceptance.py
          git diff -- scripts/production_acceptance.py
